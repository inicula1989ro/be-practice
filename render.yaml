services:
  - type: web
    name: be-practice
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /products
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: be-practice-db
          property: connectionString

databases:
  - name: be-practice-db
    plan: free
    databaseName: ecommerce
    user: ecommerce
