services:
  - type: web
    name: be-practice
    runtime: node
    plan: free
    branch: main
    # NODE_ENV=production (set below, for runtime) also affects npm during
    # the build step — npm skips devDependencies under it by default, which
    # is where typescript and all the @types/* packages live, so the build
    # fails without --include=dev forcing them in anyway.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /products
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: be-practice-db
          property: connectionString

databases:
  - name: be-practice-db
    plan: free
    databaseName: ecommerce
    user: ecommerce
