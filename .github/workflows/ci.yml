name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway Postgres, alive only for this job. GitHub Actions runs it
    # as a sibling container and maps 5432 on the runner itself, so from the
    # job's point of view it's just "localhost:5432" — no separate networking
    # setup needed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        # Postgres takes a moment to accept connections after the container
        # starts; this makes the job wait for it instead of racing it.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test
      JWT_SECRET: ci-test-secret-do-not-use-in-production

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Apply schema to the test database
        run: psql "$DATABASE_URL" -f db/schema.sql

      - name: Run tests
        run: npm test
